<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- LOGIN FORM -->
        <div id="loginSection" class="form-box">

            <h1>Login</h1>
            <p class="subtitle">Welcome back!</p>

            <form id="loginForm">

                <div class="input-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p class="switch-text">
                Don't have an account?
                <button type="button" id="showRegister">
                    Register
                </button>
            </p>

        </div>


        <!-- REGISTER FORM -->
        <div id="registerSection" class="form-box hidden">

            <h1>Create Account</h1>
            <p class="subtitle">Register a new account</p>

            <form id="registerForm">

                <div class="input-group">
                    <label>Name</label>
                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Register
                </button>

            </form>

            <p id="registerMessage"></p>

            <p class="switch-text">
                Already have an account?
                <button type="button" id="showLogin">
                    Login
                </button>
            </p>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
